appId: com.cubewatcher.launcher
productName: CW-MC Launcher
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: resources/icon.png
    to: icon.png

publish:
  provider: github
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.png
  uninstallerIcon: resources/icon.png
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target: dmg
  icon: resources/icon.png
linux:
  target: AppImage
  icon: resources/icon.png
